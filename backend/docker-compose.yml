# Local stack: PostgreSQL, the migrations, the API.
#
#   pnpm db:up        PostgreSQL only, for `pnpm start:dev` and the e2e suite
#   pnpm docker:up    the whole stack, API built from the Dockerfile
#
# Host ports are bound to 127.0.0.1. PostgreSQL uses 5433 so it does not
# collide with a native instance.

x-api-image: &api-image
  image: senami-api:local
  build:
    context: .
    target: runtime
  # Hardening: nothing to write, no privilege to gain.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16-alpine
    container_name: senami-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - senami-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 15

  # One-off: applies pending migrations, then exits. The API waits for it.
  migrate:
    <<: *api-image
    container_name: senami-migrate
    command: ['node', '--enable-source-maps', 'dist/database/migrate.js']
    environment:
      DATABASE_URL: postgres://senami_app:senami_app@postgres:5432/senami
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *api-image
    container_name: senami-api
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: log
      CORS_ORIGINS: http://localhost:3001,http://app.localhost:3001
      DATABASE_URL: postgres://senami_app:senami_app@postgres:5432/senami
      # Local stack only. Any other environment gets its own secret.
      JWT_SECRET: local-docker-only-secret-never-use-elsewhere-0123
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  senami-pgdata:
