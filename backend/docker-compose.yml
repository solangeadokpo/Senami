# Local PostgreSQL for development and the e2e suite (`pnpm db:up`).
# Port 5433 on the host, so it does not collide with a native instance.
services:
  postgres:
    image: postgres:16-alpine
    container_name: senami-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - senami-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  senami-pgdata:
